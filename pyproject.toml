[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "planlayer"
version = "0.1.0"
description = "A personal calendar and life-planning application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40,<2",
    "sqlalchemy>=2.0,<3",
    "pandas>=2.2,<4",
    "plotly>=5.24,<7",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
